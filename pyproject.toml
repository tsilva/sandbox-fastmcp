[project]
name = "sandbox-fastmcp"
version = "0.1.0"
description = "A sandbox project for learning FastMCP"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
]
